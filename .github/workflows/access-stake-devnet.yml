name: Access-stake devnet rehearsal

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full reviewed 40-character Git commit SHA
        required: true
        type: string
      acknowledge_devnet:
        description: I acknowledge this creates disposable state on Solana devnet
        required: true
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: access-stake-devnet-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: ${{ inputs.acknowledge_devnet }}
    runs-on: ubuntu-latest
    environment: access-stake-devnet
    timeout-minutes: 45
    steps:
      - name: Validate exact source commit input
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_commit must be a full lowercase SHA' >&2; exit 1; }

      - name: Check out reviewed source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact current main commit
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT" || {
            echo 'The devnet rehearsal only executes the exact current main commit.' >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Restore private three-provider RPC set
        shell: bash
        env:
          RPC_SET_B64: ${{ secrets.NEAL_DEVNET_RPC_SET_B64 }}
        run: |
          set -euo pipefail
          test -n "$RPC_SET_B64" || { echo 'NEAL_DEVNET_RPC_SET_B64 is required' >&2; exit 1; }
          printf '%s' "$RPC_SET_B64" | base64 --decode > "$RUNNER_TEMP/neal-devnet-rpc-set.json"
          chmod 600 "$RUNNER_TEMP/neal-devnet-rpc-set.json"
          echo "NEAL_DEVNET_RPC_SET_FILE=$RUNNER_TEMP/neal-devnet-rpc-set.json" >> "$GITHUB_ENV"

      - name: Restore isolated review attestation
        shell: bash
        env:
          REVIEW_ATTESTATION_B64: ${{ secrets.NEAL_ACCESS_REVIEW_ATTESTATION_B64 }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_ATTESTATION_B64" || { echo 'NEAL_ACCESS_REVIEW_ATTESTATION_B64 is required' >&2; exit 1; }
          mkdir -p outputs
          printf '%s' "$REVIEW_ATTESTATION_B64" | base64 --decode > outputs/isolated-review.json
          chmod 600 outputs/isolated-review.json

      - name: Reproduce exact release artifact twice
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: npm run access-stake:reproduce -- --commit "$SOURCE_COMMIT" --output outputs/access-stake-release

      - name: Build exact issuer bundle
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python infra/neal-access-issuer/build_bundle.py build \
            --source infra/neal-access-issuer \
            --output "outputs/neal-access-issuer-$SOURCE_COMMIT" \
            --archive "outputs/neal-access-issuer-$SOURCE_COMMIT.tar"

      - name: Restore and verify signed production review
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          REVIEW_B64: ${{ secrets.NEAL_PRODUCTION_REVIEW_B64 }}
          REVIEW_SIGSTORE_B64: ${{ secrets.NEAL_PRODUCTION_REVIEW_SIGSTORE_B64 }}
          REVIEWER_IDENTITY: ${{ secrets.NEAL_PRODUCTION_REVIEWER_IDENTITY }}
          REVIEWER_ISSUER: ${{ secrets.NEAL_PRODUCTION_REVIEWER_OIDC_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_B64"
          test -n "$REVIEW_SIGSTORE_B64"
          test -n "$REVIEWER_IDENTITY"
          test -n "$REVIEWER_ISSUER"
          printf '%s' "$REVIEW_B64" | base64 --decode > outputs/production-review.json
          printf '%s' "$REVIEW_SIGSTORE_B64" | base64 --decode > outputs/production-review.sigstore.json
          chmod 600 outputs/production-review.json outputs/production-review.sigstore.json
          npm run access-stake:verify-production-review -- \
            --review outputs/production-review.json \
            --sigstore-bundle outputs/production-review.sigstore.json \
            --release-manifest outputs/access-stake-release/release-manifest.json \
            --sbf outputs/access-stake-release/neal_access_stake.so \
            --issuer-bundle "outputs/neal-access-issuer-$SOURCE_COMMIT.tar" \
            --source-commit "$SOURCE_COMMIT" \
            --expected-identity "$REVIEWER_IDENTITY" \
            --expected-issuer "$REVIEWER_ISSUER"

      - name: Execute isolated devnet and Matrix lifecycle
        shell: bash
        run: |
          set -euo pipefail
          test -f "$NEAL_DEVNET_RPC_SET_FILE"
          npm run access-stake:rehearse-devnet -- \
            --release-manifest outputs/access-stake-release/release-manifest.json \
            --rpc-set-file "$NEAL_DEVNET_RPC_SET_FILE" \
            --review-file outputs/isolated-review.json \
            --receipt outputs/devnet-receipt.json \
            --log outputs/devnet-log.json \
            --execute --acknowledge-devnet

      - name: Validate public receipt
        run: npm run access-stake:validate-evidence -- --file outputs/devnet-receipt.json

      - name: Attest release and rehearsal evidence provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            outputs/access-stake-release/release-manifest.json
            outputs/access-stake-release/neal_access_stake.so
            outputs/neal-access-issuer-${{ inputs.source_commit }}.tar
            outputs/isolated-review.json
            outputs/production-review.json
            outputs/production-review.sigstore.json
            outputs/devnet-receipt.json
            outputs/devnet-log.json

      - name: Upload release and sanitized rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neal-access-stake-devnet-${{ inputs.source_commit }}
          path: |
            outputs/access-stake-release/release-manifest.json
            outputs/access-stake-release/neal_access_stake.so
            outputs/neal-access-issuer-${{ inputs.source_commit }}.tar
            outputs/isolated-review.json
            outputs/production-review.json
            outputs/production-review.sigstore.json
            outputs/devnet-receipt.json
            outputs/devnet-log.json
          if-no-files-found: error
