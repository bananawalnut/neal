name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Scan all reachable history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@9423510f11512992cb6c790b35e139796f7ac612 # 1.90.0

      - name: Install dependencies
        run: npm ci

      - name: Test access-stake release and evidence contracts
        run: npm run access-stake:test-tooling

      - name: Validate committed access-stake evidence
        run: npm run access-stake:validate-evidence

      - name: Type-check public site
        run: npm run site:typecheck

      - name: Validate wallet policy
        run: npm run site:validate-policy

      - name: Build public site
        run: VITE_NEAL_SOURCE_COMMIT="$(git rev-parse HEAD)" npm run site:build

      - name: Mount the reviewed manual browser build
        run: node scripts/manual-browser-dom-smoke.mjs --dist apps/site/dist --commit "$(git rev-parse HEAD)"

      - name: Package exact manual-browser artifact
        run: node scripts/manual-browser-bundle.mjs --commit "$(git rev-parse HEAD)" --dist apps/site/dist --output outputs/manual-browser-bundle.json

      - name: Upload manual-browser review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neal-manual-browser
          path: outputs/manual-browser-bundle.json
          if-no-files-found: error

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - name: Build launch-console WASM bindings
        run: npm run launcher:wasm

      - name: Type-check launch console
        run: npm run launcher:typecheck

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@9423510f11512992cb6c790b35e139796f7ac612 # 1.90.0

      - name: Run workspace tests
        run: cargo test --workspace --locked

  sbf:
    name: Reproducible access-stake SBF build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build the selected commit twice in isolated pinned containers
        run: npm run access-stake:reproduce -- --commit "$(git rev-parse HEAD)" --output outputs/access-stake-release

      - name: Upload SBF review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neal-access-stake-sbf
          path: |
            outputs/access-stake-release/neal_access_stake.so
            outputs/access-stake-release/release-manifest.json
          if-no-files-found: error

  issuer:
    name: Issuer checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install issuer dependencies
        run: "python -m pip install --no-index --find-links wheelhouse --only-binary=:all: --require-hashes --requirement requirements-deploy.txt"
        working-directory: infra/neal-access-issuer

      - name: Run issuer tests
        run: python -m unittest -v test_issuer.py test_admin_broker.py
        working-directory: infra/neal-access-issuer

      - name: Build and verify offline issuer bundle
        run: |
          python build_bundle.py build \
            --source . \
            --output ../../outputs/issuer-bundle \
            --archive ../../outputs/issuer-bundle.tar
          python build_bundle.py verify --bundle ../../outputs/issuer-bundle
        working-directory: infra/neal-access-issuer

      - name: Upload issuer bundle and SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neal-access-issuer-bundle
          path: |
            outputs/issuer-bundle.tar
            outputs/issuer-bundle/bundle-manifest.json
            outputs/issuer-bundle/sbom.cdx.json
          if-no-files-found: error
