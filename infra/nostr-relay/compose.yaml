name: neal-nostr

services:
  relay:
    image: ghcr.io/hoytech/strfry@sha256:7349cd736b2dd99f152592e414530f12f99886730afa89fccf9bb5407e1f4a9b
    command: ["--config", "/etc/strfry.conf", "relay"]
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - ./strfry.conf:/etc/strfry.conf:ro
      - relay-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    stop_grace_period: 20s

volumes:
  relay-data:
    name: neal-nostr-relay-data
