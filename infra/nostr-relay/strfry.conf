# NEAL's bare Nostr relay. The container is published to host loopback only;
# public TLS/WSS ingress is a separate, explicit deployment step.
db = "/data/strfry-db/"

dbParams {
    maxreaders = 64
    # Hard ceiling for the laptop rehearsal. LMDB grows on demand up to this map.
    mapsize = 536870912
    noReadAhead = false
}

events {
    maxEventSize = 16384
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 31536000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 64
    maxTagValSize = 512
}

relay {
    # Docker exposes this only as 127.0.0.1:7777 on the Mac.
    bind = "0.0.0.0"
    port = 7777
    nofiles = 4096
    realIpHeader = ""

    auth {
        enabled = true
        serviceUrl = "wss://nostr.nealtheseal.org"
        restrictedReadKinds = "4, 1059"
        restrictReadToInvolvedPubkey = true
    }

    info {
        name = "NEAL relay"
        description = "The bare, signed Nostr event relay for the NEAL community. No wallet keys live here. Public policies and moderation controls are still being developed."
        pubkey = ""
        self = ""
        contact = "https://nealtheseal.org"
        icon = "https://nealtheseal.org/neal-favicon.png"
        banner = "https://nealtheseal.org/og-neal-v3.jpg"
        privacy = ""
        terms = ""
        nips = ""
    }

    maxWebsocketPayloadSize = 32768
    maxReqFilterSize = 10
    autoPingSeconds = 45
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 5000
    maxFilterLimit = 200
    maxTagsPerFilter = 3
    maxFilterLimitCount = 10000
    maxSubsPerConnection = 10
    maxPendingOutboundBytes = 4194304

    writePolicy {
        plugin = ""
        timeoutSeconds = 5
    }

    compression {
        enabled = true
        slidingWindow = false
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 1
        reqWorker = 1
        reqMonitor = 1
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 50000
    }

    filterValidation {
        enabled = true
        maxFiltersPerReq = 5
        minFiltersPerReq = 1
        maxKindsPerFilter = 10
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
